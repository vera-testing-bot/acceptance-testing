# vera-template-version: 2026.05.04
# DO NOT EDIT — managed by WorkflowManager. Manual edits will be overwritten.
#
# AGENT-NOTE: This file is a PURE BOOTLOADER. It must not contain any
# job-type-specific logic, runtime-specific branches, tool allowlists, or
# business logic of any kind. All of that lives server-side in:
#   - src/vera/github/bootloader_script.py  (exec_script assembly)
#   - src/vera/github/job_api.py             (credential exchange + callback)
#   - src/vera/models/job.py                 (job state)
# See docs/spec/workflow-template.md "Bootloader responsibility" for the
# contract this file must satisfy. Because this file is installed into every
# customer repository, every edit forces re-installation across all customer
# installs — keep it thin and stable. Changes trigger a CI guard workflow.
#
# AGENT-NOTE: After editing this template, run
#   `GH_TOKEN=$(gh auth token) uv run python scripts/ci/check_workflow_template_sync.py`
# to confirm the deployed copy in vera-testing-bot/acceptance-testing is in
# sync. CI will fail on push-to-main if it isn't. Incident:
# docs/failures/2026-04/23-workflow-template-drift.md
name: Vera

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Vera job ID"
        required: false
        default: ""
        type: string
      callback_token:
        description: "HMAC callback token for Vera API auth"
        required: false
        default: ""
        type: string
      vera_api_url:
        description: "Vera API base URL for credential exchange and callbacks"
        required: false
        default: ""
        type: string

jobs:
  vera:
    runs-on: vera-runner
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch job package
        env:
          VERA_JOB_ID: ${{ inputs.job_id }}
          VERA_CALLBACK_TOKEN: ${{ inputs.callback_token }}
          VERA_API_URL: ${{ inputs.vera_api_url }}
        run: |
          if [ -z "$VERA_API_URL" ] || [ -z "$VERA_JOB_ID" ] || [ -z "$VERA_CALLBACK_TOKEN" ]; then
            echo "::error::Missing required inputs: vera_api_url, job_id, or callback_token"
            exit 1
          fi
          # Retry policy is owned by this loop, NOT curl's --retry. The Vera
          # dispatcher fires workflow_dispatch before the pending→running DB
          # commit lands; the runner can win the race and hit a 409
          # job_not_ready. curl's --retry only covers transport / 5xx, so we
          # retry 409s explicitly here. ~5 attempts * 2s sleep = ~10s budget,
          # well above the typical sub-second pending→running window.
          # Credential response stays in $BODY only — never on disk (#2208).
          ATTEMPT=0
          MAX_ATTEMPTS=5
          while :; do
            RESPONSE=$(curl -sS -w $'\n%{http_code}' \
              -X POST "${VERA_API_URL}/internal/jobs/credentials" \
              -H "Content-Type: application/json" \
              -d "{\"job_id\": \"${VERA_JOB_ID}\", \"token\": \"${VERA_CALLBACK_TOKEN}\"}") || RESPONSE=$'\n000'
            HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
            BODY=$(printf '%s' "$RESPONSE" | sed '$d')
            # One observability line per attempt so the cadence is visible
            # in the runner log even on success (issue #2060).
            echo "vera-creds: attempt $((ATTEMPT + 1))/${MAX_ATTEMPTS} http=${HTTP_CODE}"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "410" ]; then
              break
            fi
            if [ "$HTTP_CODE" = "409" ] && \
               [ "$(printf '%s' "$BODY" | jq -r '.code // empty' 2>/dev/null)" = "job_not_ready" ]; then
              ATTEMPT=$((ATTEMPT + 1))
              if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
                echo "::error::vera-creds: budget exhausted after ${MAX_ATTEMPTS} attempts of job_not_ready"
                printf '%s\n' "$BODY"
                exit 1
              fi
              sleep 2
              continue
            fi
            echo "::error::vera-creds: non-retryable HTTP ${HTTP_CODE} on attempt $((ATTEMPT + 1))"
            printf '%s\n' "$BODY"
            exit 1
          done
          if [ "$HTTP_CODE" = "410" ]; then
            echo "Job was cancelled by Vera, exiting gracefully"
            exit 0
          fi
          if [ "$(printf '%s' "$BODY" | jq -r '.status // empty')" != "ok" ]; then
            echo "::error::Credential exchange returned a non-ok status"
            exit 1
          fi
          # Mask every secret BEFORE exporting it.
          while IFS='=' read -r k v; do
            [ -z "$k" ] && continue
            echo "::add-mask::${v}"
            echo "${k}=${v}" >> "$GITHUB_ENV"
          done < <(printf '%s' "$BODY" | jq -r '.secrets // {} | to_entries[] | "\(.key)=\(.value)"')
          # Non-secret env vars (verbatim).
          printf '%s' "$BODY" | jq -r '.env // {} | to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"
          # Opaque exec_script — the bootloader does not parse it.
          umask 077
          printf '%s' "$BODY" | jq -r '.exec_script // empty' > /tmp/vera_exec.sh
          chmod +x /tmp/vera_exec.sh

      - name: Run
        env:
          GH_TOKEN: ${{ env.GITHUB_APP_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ env.GITHUB_APP_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash /tmp/vera_exec.sh

      - name: Report success
        if: success()
        env:
          VERA_JOB_ID: ${{ inputs.job_id }}
          VERA_CALLBACK_TOKEN: ${{ inputs.callback_token }}
          VERA_API_URL: ${{ inputs.vera_api_url }}
        run: |
          OUTCOME_FIELD=""
          if [ -f /tmp/vera_outcome.json ]; then
            OUTCOME_JSON=$(jq -c . /tmp/vera_outcome.json 2>/dev/null || echo "")
            if [ -n "$OUTCOME_JSON" ]; then
              OUTCOME_FIELD=", \"outcome\": ${OUTCOME_JSON}"
            fi
          fi
          STATUS="completed"
          ERROR_FIELD=""
          if [ -f /tmp/vera_agent_exit_code ]; then
            AGENT_EC=$(tr -d '[:space:]' < /tmp/vera_agent_exit_code)
            if [ -n "$AGENT_EC" ] && [ "$AGENT_EC" != "0" ]; then
              STATUS="failed"
              ERROR_FIELD=", \"error\": \"Agent exited with code ${AGENT_EC}\""
            fi
          fi
          PAYLOAD="{\"job_id\": \"${VERA_JOB_ID}\", \"token\": \"${VERA_CALLBACK_TOKEN}\", \"status\": \"${STATUS}\"${OUTCOME_FIELD}${ERROR_FIELD}}"
          curl -sf --retry 3 --retry-delay 5 \
            -X POST "${VERA_API_URL}/internal/jobs/callback" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            || echo "::warning::Failed to report callback to Vera API"

      - name: Report failure
        if: failure()
        env:
          VERA_JOB_ID: ${{ inputs.job_id }}
          VERA_CALLBACK_TOKEN: ${{ inputs.callback_token }}
          VERA_API_URL: ${{ inputs.vera_api_url }}
        run: |
          curl -sf --retry 3 --retry-delay 5 \
            -X POST "${VERA_API_URL}/internal/jobs/callback" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\": \"${VERA_JOB_ID}\", \"token\": \"${VERA_CALLBACK_TOKEN}\", \"status\": \"failed\", \"error\": \"Workflow failed\"}" \
            || echo "::warning::Failed to report failure to Vera API"
