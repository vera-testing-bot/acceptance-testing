# vera-template-version: 2026.04.15
# DO NOT EDIT — managed by WorkflowManager. Manual edits will be overwritten.
#
# AGENT-NOTE: This file is a PURE BOOTLOADER. It must not contain any
# job-type-specific logic, runtime-specific branches, tool allowlists, or
# business logic of any kind. All of that lives server-side in:
#   - src/vera/github/bootloader_script.py  (exec_script assembly)
#   - src/vera/github/job_api.py             (credential exchange + callback)
#   - src/vera/models/job.py                 (job state)
# See docs/spec/workflow-template.md "Bootloader responsibility" for the
# contract this file must satisfy. Because this file is installed into every
# customer repository, every edit forces re-installation across all customer
# installs — keep it thin and stable. Changes trigger a CI guard workflow.
name: Vera

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Vera job ID"
        required: false
        default: ""
        type: string
      callback_token:
        description: "HMAC callback token for Vera API auth"
        required: false
        default: ""
        type: string
      vera_api_url:
        description: "Vera API base URL for credential exchange and callbacks"
        required: false
        default: ""
        type: string

jobs:
  vera:
    runs-on: vera-runner
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch job package
        env:
          VERA_JOB_ID: ${{ inputs.job_id }}
          VERA_CALLBACK_TOKEN: ${{ inputs.callback_token }}
          VERA_API_URL: ${{ inputs.vera_api_url }}
        run: |
          if [ -z "$VERA_API_URL" ] || [ -z "$VERA_JOB_ID" ] || [ -z "$VERA_CALLBACK_TOKEN" ]; then
            echo "::error::Missing required inputs: vera_api_url, job_id, or callback_token"
            exit 1
          fi
          HTTP_CODE=$(curl -s --retry 3 --retry-delay 5 \
            -o /tmp/vera_creds.json -w "%{http_code}" \
            -X POST "${VERA_API_URL}/internal/jobs/credentials" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\": \"${VERA_JOB_ID}\", \"token\": \"${VERA_CALLBACK_TOKEN}\"}")
          if [ "$HTTP_CODE" = "410" ]; then
            echo "Job was cancelled by Vera, exiting gracefully"
            exit 0
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to fetch credentials from Vera API (HTTP $HTTP_CODE)"
            cat /tmp/vera_creds.json 2>/dev/null || true
            exit 1
          fi
          RESPONSE=$(cat /tmp/vera_creds.json)
          rm -f /tmp/vera_creds.json
          if [ "$(echo "$RESPONSE" | jq -r '.status // empty')" != "ok" ]; then
            echo "::error::Credential exchange returned a non-ok status"
            exit 1
          fi
          # Mask every secret BEFORE writing it to $GITHUB_ENV.
          echo "$RESPONSE" | jq -r '.secrets // {} | to_entries[] | "\(.key)=\(.value)"' > /tmp/vera_secrets.env
          while IFS='=' read -r k v; do
            [ -z "$k" ] && continue
            echo "::add-mask::${v}"
            echo "${k}=${v}" >> "$GITHUB_ENV"
          done < /tmp/vera_secrets.env
          rm -f /tmp/vera_secrets.env
          # Non-secret env vars (verbatim).
          echo "$RESPONSE" | jq -r '.env // {} | to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"
          # Opaque exec_script — the bootloader does not parse it.
          echo "$RESPONSE" | jq -r '.exec_script // empty' > /tmp/vera_exec.sh
          chmod +x /tmp/vera_exec.sh

      - name: Run
        env:
          GH_TOKEN: ${{ env.GITHUB_APP_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ env.GITHUB_APP_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash /tmp/vera_exec.sh

      - name: Report success
        if: success()
        env:
          VERA_JOB_ID: ${{ inputs.job_id }}
          VERA_CALLBACK_TOKEN: ${{ inputs.callback_token }}
          VERA_API_URL: ${{ inputs.vera_api_url }}
        run: |
          OUTCOME_FIELD=""
          if [ -f /tmp/vera_outcome.json ]; then
            OUTCOME_JSON=$(jq -c . /tmp/vera_outcome.json 2>/dev/null || echo "")
            if [ -n "$OUTCOME_JSON" ]; then
              OUTCOME_FIELD=", \"outcome\": ${OUTCOME_JSON}"
            fi
          fi
          PAYLOAD="{\"job_id\": \"${VERA_JOB_ID}\", \"token\": \"${VERA_CALLBACK_TOKEN}\", \"status\": \"completed\"${OUTCOME_FIELD}}"
          curl -sf --retry 3 --retry-delay 5 \
            -X POST "${VERA_API_URL}/internal/jobs/callback" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            || echo "::warning::Failed to report success to Vera API"

      - name: Report failure
        if: failure()
        env:
          VERA_JOB_ID: ${{ inputs.job_id }}
          VERA_CALLBACK_TOKEN: ${{ inputs.callback_token }}
          VERA_API_URL: ${{ inputs.vera_api_url }}
        run: |
          curl -sf --retry 3 --retry-delay 5 \
            -X POST "${VERA_API_URL}/internal/jobs/callback" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\": \"${VERA_JOB_ID}\", \"token\": \"${VERA_CALLBACK_TOKEN}\", \"status\": \"failed\", \"error\": \"Workflow failed\"}" \
            || echo "::warning::Failed to report failure to Vera API"
