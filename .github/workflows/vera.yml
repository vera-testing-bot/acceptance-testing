name: Vera

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Vera job ID"
        required: false
        default: ""
        type: string
      issue_number:
        description: "GitHub issue number to work on"
        required: false
        default: ""
        type: string
      callback_token:
        description: "HMAC callback token for Vera API auth"
        required: false
        default: ""
        type: string
      vera_api_url:
        description: "Vera API base URL for credential exchange and callbacks"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  vera:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch credentials
        id: creds
        env:
          VERA_JOB_ID: ${{ inputs.job_id }}
          VERA_CALLBACK_TOKEN: ${{ inputs.callback_token }}
          VERA_API_URL: ${{ inputs.vera_api_url }}
        run: |
          if [ -z "$VERA_API_URL" ] || [ -z "$VERA_JOB_ID" ] || [ -z "$VERA_CALLBACK_TOKEN" ]; then
            echo "::error::Missing required inputs: vera_api_url, job_id, or callback_token"
            exit 1
          fi
          RESPONSE=$(curl -sf --retry 3 --retry-delay 5 \
            -X POST "${VERA_API_URL}/internal/jobs/credentials" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\": \"${VERA_JOB_ID}\", \"token\": \"${VERA_CALLBACK_TOKEN}\"}")
          API_KEY=$(echo "$RESPONSE" | jq -r '.anthropic_api_key // empty')
          if [ -z "$API_KEY" ]; then
            echo "::error::Failed to fetch credentials from Vera API"
            exit 1
          fi
          echo "::add-mask::${API_KEY}"
          echo "anthropic_api_key=${API_KEY}" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ steps.creds.outputs.anthropic_api_key }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Implement the requirements described in issue #${{ inputs.issue_number }}.
            Read the issue first, then implement the changes and create a pull request.

      - name: Report success
        if: success()
        env:
          VERA_JOB_ID: ${{ inputs.job_id }}
          VERA_CALLBACK_TOKEN: ${{ inputs.callback_token }}
          VERA_API_URL: ${{ inputs.vera_api_url }}
        run: |
          curl -sf --retry 3 --retry-delay 5 \
            -X POST "${VERA_API_URL}/internal/jobs/callback" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\": \"${VERA_JOB_ID}\", \"token\": \"${VERA_CALLBACK_TOKEN}\", \"status\": \"completed\"}" \
            || echo "::warning::Failed to report success to Vera API"

      - name: Report failure
        if: failure()
        env:
          VERA_JOB_ID: ${{ inputs.job_id }}
          VERA_CALLBACK_TOKEN: ${{ inputs.callback_token }}
          VERA_API_URL: ${{ inputs.vera_api_url }}
        run: |
          curl -sf --retry 3 --retry-delay 5 \
            -X POST "${VERA_API_URL}/internal/jobs/callback" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\": \"${VERA_JOB_ID}\", \"token\": \"${VERA_CALLBACK_TOKEN}\", \"status\": \"failed\", \"error\": \"Workflow failed\"}" \
            || echo "::warning::Failed to report failure to Vera API"

      - name: Cleanup workspace
        if: always()
        run: |
          echo "Cleaning up ephemeral workspace"
          cd /
          rm -rf "$GITHUB_WORKSPACE" || echo "Workspace cleanup skipped (bind mount)"
          echo "Workspace cleaned"
